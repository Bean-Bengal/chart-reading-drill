<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Chart Reading Drill</title>
<style>
*{box-sizing:border-box}
body{font-family:sans-serif;margin:0;padding:16px;background:#f6f1e7;color:#222;max-width:520px}
h1{font-size:22px;margin:0 0 8px}
#steps{display:flex;gap:6px;margin:12px 0}
.s{flex:1;min-width:0;text-align:center;padding:12px 0;font-size:22px;border:2px solid #333;border-radius:8px;background:#fff}
.s.done{background:#4a8a5c;color:#fff}
.s.next{background:#ffd966}
#ruler{position:relative;height:60px;border-bottom:2px solid #333;background:#fff;margin:12px 0}
.m{position:absolute;bottom:0;width:2px;background:#c8552e}
.m b{position:absolute;top:-16px;left:-8px;font-size:11px;font-weight:normal;white-space:nowrap}
#tap{width:100%;min-height:80px;font-size:22px;border:2px solid #333;border-radius:8px;background:#fff}
button{min-height:44px;font-size:16px;margin-top:8px;padding:0 16px;border:2px solid #333;border-radius:8px;background:#fff}
#info{min-height:40px;margin-top:8px;font-size:14px}
</style></head><body>
<script data-bean-store>(function(){if(typeof location!=='undefined'&&location&&location.protocol==='about:'&&typeof document!=='undefined'&&document.addEventListener){document.addEventListener('click',function(e){var a=e.target&&e.target.closest&&e.target.closest('a[href^="#"]');if(!a||a.target==='_blank')return;e.preventDefault();try{location.hash=a.getAttribute('href')}catch(x){}},true)}if(typeof window==='undefined')return;try{window.localStorage.getItem('x');return}catch(e){}var d=Object.assign({},window.__BEAN_SAVED||{});function post(){try{parent.postMessage({type:'bean-store',data:d},'*')}catch(e){}}var ls={getItem:function(k){return Object.prototype.hasOwnProperty.call(d,k)?d[k]:null},setItem:function(k,v){d[k]=String(v);post()},removeItem:function(k){delete d[k];post()},clear:function(){d={};post()},key:function(i){return Object.keys(d)[i]||null}};Object.defineProperty(ls,'length',{get:function(){return Object.keys(d).length}});try{Object.defineProperty(window,'localStorage',{value:ls,configurable:true})}catch(e){}})();</script>
<h1>Crossover Pattern Drill</h1>
<div>Tap slowly, one tap per step.</div>
<div id="steps"></div>
<div id="ruler"></div>
<button id="tap">Tap</button>
<div id="info"></div>
<button id="reset">Start over</button>
<script>
var pat=[4,8,4,6,4,2],taps=[];
function draw(){
  var s=document.getElementById('steps');s.innerHTML='';
  pat.forEach(function(p,i){var d=document.createElement('div');d.className='s'+(i<taps.length?' done':i===taps.length?' next':'');d.textContent=p;s.appendChild(d)});
  var r=document.getElementById('ruler');r.innerHTML='';
  var end=taps.length?Math.max(taps[taps.length-1],3000):3000,info='';
  taps.forEach(function(t,i){
    var m=document.createElement('div');m.className='m';m.style.left=(t/end*96+1)+'%';m.style.height=(20+i*6)+'px';
    m.innerHTML='<b>'+pat[i]+'</b>';r.appendChild(m);
    info+=(i?'gap '+((t-taps[i-1])/1000).toFixed(2)+'s, ':'')+'';
  });
  var gaps=[];for(var i=1;i<taps.length;i++)gaps.push(((taps[i]-taps[i-1])/1000).toFixed(2)+'s');
  document.getElementById('info').textContent=taps.length>=pat.length?'Done. Gaps: '+gaps.join(', '):(gaps.length?'Gaps: '+gaps.join(', '):'');
}
var t0=0;
document.getElementById('tap').onclick=function(){
  if(taps.length>=pat.length)return;
  var n=Date.now();if(!taps.length)t0=n;
  taps.push(n-t0);draw();
};
document.getElementById('reset').onclick=function(){taps=[];draw()};
draw();
</script></body></html>
